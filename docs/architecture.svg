<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 990' width='100%'><defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#6b7280'/></marker></defs><rect width='1000' height='990' fill='#ffffff'/><text x='30' y='28' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='18' font-weight='700' fill='#111827'>ads-mcp-agent — architecture, v0.2</text><text x='38' y='56' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12' font-weight='700' letter-spacing='2' fill='#6b7280'>PEOPLE</text><rect x='30' y='66' width='940' height='96' rx='10' fill='#f3effa' stroke='#9ca3af' stroke-dasharray='6 4'/><rect x='45' y='81' width='215' height='66' rx='6' fill='#ffffff' stroke='#7b5ea7' stroke-width='1.4'/><text x='152.5' y='103' text-anchor='middle' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='14' font-weight='700' fill='#1f2937'>You</text><text x='152.5' y='121' text-anchor='middle' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' fill='#4b5563'>ask in plain words,</text><text x='152.5' y='136' text-anchor='middle' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' fill='#4b5563'>approve every write</text><line x1='500.0' y1='166' x2='500.0' y2='188' stroke='#6b7280' stroke-width='1.4' marker-end='url(#arrow)'/><text x='510.0' y='182' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-style='italic' fill='#6b7280'>opens</text><text x='38' y='212' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12' font-weight='700' letter-spacing='2' fill='#6b7280'>WHAT YOU OPEN</text><rect x='30' y='222' width='940' height='96' rx='10' fill='#eef3fb' stroke='#9ca3af' stroke-dasharray='6 4'/><rect x='45' y='237' width='215' height='66' rx='6' fill='#ffffff' stroke='#2f4a7a' stroke-width='1.4'/><text x='152.5' y='259' text-anchor='middle' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='14' font-weight='700' fill='#1f2937'>Chat page</text><text x='152.5' y='277' text-anchor='middle' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' fill='#4b5563'>ask, see the agent's plan,</text><text x='152.5' y='292' text-anchor='middle' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' fill='#4b5563'>say yes or no</text><rect x='276' y='237' width='215' height='66' rx='6' fill='#ffffff' stroke='#2f4a7a' stroke-width='1.4'/><text x='383.5' y='259' text-anchor='middle' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='14' font-weight='700' fill='#1f2937'>Write log page</text><text x='383.5' y='277' text-anchor='middle' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' fill='#4b5563'>every change, before</text><text x='383.5' y='292' text-anchor='middle' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' fill='#4b5563'>and after values</text><line x1='500.0' y1='322' x2='500.0' y2='344' stroke='#6b7280' stroke-width='1.4' marker-end='url(#arrow)'/><text x='510.0' y='338' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-style='italic' fill='#6b7280'>drives</text><text x='38' y='368' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12' font-weight='700' letter-spacing='2' fill='#6b7280'>WHAT RUNS</text><rect x='30' y='378' width='940' height='96' rx='10' fill='#eef6f1' stroke='#9ca3af' stroke-dasharray='6 4'/><rect x='45' y='393' width='215' height='66' rx='6' fill='#ffffff' stroke='#2e6b4a' stroke-width='1.4'/><text x='152.5' y='415' text-anchor='middle' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='14' font-weight='700' fill='#1f2937'>Agent loop</text><text x='152.5' y='433' text-anchor='middle' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' fill='#4b5563'>sends the chat and tool list,</text><text x='152.5' y='448' text-anchor='middle' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' fill='#4b5563'>gets back a tool call</text><rect x='276' y='393' width='215' height='66' rx='6' fill='#ffffff' stroke='#2e6b4a' stroke-width='1.4'/><text x='383.5' y='415' text-anchor='middle' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='14' font-weight='700' fill='#1f2937'>Confirm gate</text><text x='383.5' y='433' text-anchor='middle' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' fill='#4b5563'>holds a write until</text><text x='383.5' y='448' text-anchor='middle' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' fill='#4b5563'>you say yes</text><rect x='507' y='393' width='215' height='66' rx='6' fill='#ffffff' stroke='#2e6b4a' stroke-width='1.4'/><text x='614.5' y='415' text-anchor='middle' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='14' font-weight='700' fill='#1f2937'>Cap check</text><text x='614.5' y='433' text-anchor='middle' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' fill='#4b5563'>refuses a write</text><text x='614.5' y='448' text-anchor='middle' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' fill='#4b5563'>above the spend cap</text><rect x='738' y='393' width='215' height='66' rx='6' fill='#ffffff' stroke='#2e6b4a' stroke-width='1.4'/><text x='845.5' y='415' text-anchor='middle' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='14' font-weight='700' fill='#1f2937'>MCP client</text><text x='845.5' y='433' text-anchor='middle' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' fill='#4b5563'>lists tools,</text><text x='845.5' y='448' text-anchor='middle' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' fill='#4b5563'>calls the one chosen</text><line x1='500.0' y1='478' x2='500.0' y2='500' stroke='#6b7280' stroke-width='1.4' marker-end='url(#arrow)'/><text x='510.0' y='494' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-style='italic' fill='#6b7280'>writes</text><text x='38' y='524' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12' font-weight='700' letter-spacing='2' fill='#6b7280'>WHAT IT WRITES</text><rect x='30' y='534' width='940' height='96' rx='10' fill='#fdf6ea' stroke='#9ca3af' stroke-dasharray='6 4'/><rect x='45' y='549' width='215' height='66' rx='6' fill='#ffffff' stroke='#a8780f' stroke-width='1.4'/><text x='152.5' y='571' text-anchor='middle' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='14' font-weight='700' fill='#1f2937'>Write log</text><text x='152.5' y='589' text-anchor='middle' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' fill='#4b5563'>what changed, from what,</text><text x='152.5' y='604' text-anchor='middle' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' fill='#4b5563'>on whose yes</text><rect x='276' y='549' width='215' height='66' rx='6' fill='#ffffff' stroke='#a8780f' stroke-width='1.4'/><text x='383.5' y='571' text-anchor='middle' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='14' font-weight='700' fill='#1f2937'>Call log</text><text x='383.5' y='589' text-anchor='middle' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' fill='#4b5563'>each ask, the tools it used,</text><text x='383.5' y='604' text-anchor='middle' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' fill='#4b5563'>and how many calls</text><rect x='507' y='549' width='215' height='66' rx='6' fill='#ffffff' stroke='#a8780f' stroke-width='1.4'/><text x='614.5' y='571' text-anchor='middle' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='14' font-weight='700' fill='#1f2937'>Tool gaps</text><text x='614.5' y='589' text-anchor='middle' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' fill='#4b5563'>asks no tool</text><text x='614.5' y='604' text-anchor='middle' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' fill='#4b5563'>could answer</text><line x1='500.0' y1='634' x2='500.0' y2='656' stroke='#6b7280' stroke-width='1.4' marker-end='url(#arrow)'/><text x='510.0' y='650' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-style='italic' fill='#6b7280'>sends and reads through</text><text x='38' y='680' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12' font-weight='700' letter-spacing='2' fill='#6b7280'>HOW IT REACHES AMAZON</text><rect x='30' y='690' width='940' height='96' rx='10' fill='#f6f3ee' stroke='#9ca3af' stroke-dasharray='6 4'/><rect x='45' y='705' width='215' height='66' rx='6' fill='#ffffff' stroke='#7d6440' stroke-width='1.4'/><text x='152.5' y='727' text-anchor='middle' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='14' font-weight='700' fill='#1f2937'>Endpoint switch</text><text x='152.5' y='745' text-anchor='middle' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' fill='#4b5563'>fake server or</text><text x='152.5' y='760' text-anchor='middle' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' fill='#4b5563'>Amazon's NA endpoint</text><rect x='276' y='705' width='215' height='66' rx='6' fill='#ffffff' stroke='#7d6440' stroke-width='1.4'/><text x='383.5' y='727' text-anchor='middle' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='14' font-weight='700' fill='#1f2937'>Token refresher</text><text x='383.5' y='745' text-anchor='middle' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' fill='#4b5563'>swaps the refresh token</text><text x='383.5' y='760' text-anchor='middle' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' fill='#4b5563'>for an hourly access token</text><rect x='507' y='705' width='215' height='66' rx='6' fill='#ffffff' stroke='#7d6440' stroke-width='1.4'/><text x='614.5' y='727' text-anchor='middle' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='14' font-weight='700' fill='#1f2937'>Secrets</text><text x='614.5' y='745' text-anchor='middle' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' fill='#4b5563'>held by the host,</text><text x='614.5' y='760' text-anchor='middle' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' fill='#4b5563'>never in the repo</text><line x1='500.0' y1='790' x2='500.0' y2='812' stroke='#6b7280' stroke-width='1.4' marker-end='url(#arrow)'/><text x='510.0' y='806' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' font-style='italic' fill='#6b7280'>talks to</text><text x='38' y='836' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='12' font-weight='700' letter-spacing='2' fill='#6b7280'>EVERYTHING ELSE</text><rect x='30' y='846' width='940' height='96' rx='10' fill='#f3f4f6' stroke='#9ca3af' stroke-dasharray='6 4'/><rect x='45' y='861' width='215' height='66' rx='6' fill='#ffffff' stroke='#6b7280' stroke-width='1.4'/><text x='152.5' y='883' text-anchor='middle' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='14' font-weight='700' fill='#1f2937'>Claude API</text><text x='152.5' y='901' text-anchor='middle' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' fill='#4b5563'>the model</text><rect x='276' y='861' width='215' height='66' rx='6' fill='#ffffff' stroke='#6b7280' stroke-width='1.4'/><text x='383.5' y='883' text-anchor='middle' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='14' font-weight='700' fill='#1f2937'>Fake MCP server</text><text x='383.5' y='901' text-anchor='middle' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' fill='#4b5563'>same tool shapes,</text><text x='383.5' y='916' text-anchor='middle' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' font-size='11.5' fill='#4b556